# Frontend Nginx Reverse Proxy Configuration (Port 80 & 443)
server {
    listen 80 default_server;
    server_name nenenainaemak.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name nenenainaemak.duckdns.org;

    ssl_certificate /etc/ssl/wp/fullchain.pem;
    ssl_certificate_key /etc/ssl/wp/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64M;

    include snippets/security-headers.conf;

    # --- กฎความปลอดภัยที่ตั้งไว้แล้ว ---
    if ($block_author) { return 403; }
    location = /xmlrpc.php { return 403; }

    # --- บล็อก Information Disclosure & Attack Surface ---
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php|wp-links-opml\.php) {
        return 404;
    }
    location = /wp-admin/install.php {
        return 404;
    }
    location ~* ^/wp-includes/.*\.php$ {
        return 404;
    }
    location ~* ^/wp-content/uploads/.*\.php$ {
        return 404;
    }

    # --- กำหนดเงื่อนไขไม่ใช้ cache ---
    set $skip_cache 0;
    if ($request_method = POST) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "/wp-admin/|/wp-login\.php|/wp-json/|/wp-cron\.php|/feed/") { set $skip_cache 1; }
    if ($http_cookie ~* "wordpress_logged_in|comment_author|wp-postpass") { set $skip_cache 1; }

    # --- ล็อกอิน: จำกัดความถี่ แล้วส่งต่อแบ็กเอนด์ ---
    location = /wp-login.php {
        include snippets/security-headers.conf;
        limit_req zone=wplogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- ทุกหน้า: reverse proxy + cache ---
    include snippets/secdash.conf;

    location / {
        include snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache wpcache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
