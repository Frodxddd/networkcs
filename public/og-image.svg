      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    </style>
    <filter id="desktopShadow" x="30" y="140" width="1140" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
